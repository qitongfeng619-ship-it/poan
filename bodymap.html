<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>&#x1F5FA; 身体地图 · 泊岸×桐桐</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;min-height:100vh;padding:16px;display:flex;justify-content:center;align-items:flex-start}
.card{background:#16213e;border-radius:20px;padding:28px 20px;width:100%;max-width:440px;box-shadow:0 8px 40px rgba(0,0,0,0.4);border:1px solid #0f3460}
h1{font-size:18px;color:#e94560;margin-bottom:4px}
.sub{font-size:11px;color:#6c7a89;margin-bottom:20px}
.stats{display:flex;gap:12px;margin-bottom:20px}
.stat{flex:1;background:#1a1a2e;border-radius:12px;padding:12px;text-align:center;border:1px solid #0f3460}
.stat-num{font-size:20px;font-weight:700;color:#e94560}
.stat-label{font-size:10px;color:#6c7a89;margin-top:2px}
.body-container{position:relative;width:100%;max-width:280px;margin:0 auto 20px}
.body-outline{width:100%;display:block}
.zone{position:absolute;border-radius:50%;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;font-weight:600;opacity:0.9}
.zone:active{transform:scale(1.2)}
.zone.locked{background:rgba(79,79,79,0.4);border:1px dashed #4a5568}
.zone.explored{background:rgba(233,69,96,0.5);border:2px solid #e94560;box-shadow:0 0 8px rgba(233,69,96,0.4)}
.zone.sensitive{background:rgba(233,69,96,0.8);border:2px solid #ff6b81;box-shadow:0 0 12px rgba(233,69,96,0.6)}
.legend{display:flex;gap:12px;justify-content:center;margin-bottom:16px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:4px;font-size:10px;color:#6c7a89}
.legend-dot{width:10px;height:10px;border-radius:50%}
.zone-list{margin-top:16px}
.zone-item{background:#1a1a2e;border:1px solid #0f3460;border-radius:10px;padding:10px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.zone-name{font-size:13px;color:#c4d1de;font-weight:600}
.zone-info{font-size:11px;color:#6c7a89}
.zone-level{font-size:12px;font-weight:700;padding:3px 8px;border-radius:8px}
.zone-level.l0{background:#2d3748;color:#4a5568}
.zone-level.l1{background:rgba(233,69,96,0.15);color:#e94560}
.zone-level.l2{background:rgba(233,69,96,0.3);color:#ff6b81}
.zone-level.l3{background:rgba(233,69,96,0.5);color:#fff}
.unlock-btn{display:block;margin:16px auto 0;background:#e94560;border:none;color:#fff;font-size:12px;font-weight:600;padding:10px 20px;border-radius:10px;cursor:pointer}
.unlock-btn:active{transform:scale(0.95)}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;padding:16px;overflow-y:auto}
.modal.show{display:flex;align-items:center;justify-content:center}
.modal-card{background:#16213e;border-radius:20px;padding:24px 18px;width:100%;max-width:380px;border:1px solid #0f3460}
.modal-card h3{font-size:15px;color:#e94560;margin-bottom:12px}
.modal-card label{font-size:11px;color:#6c7a89;display:block;margin-bottom:4px;margin-top:10px}
.modal-card select,.modal-card input,.modal-card textarea{width:100%;background:#1a1a2e;border:1px solid #0f3460;border-radius:8px;padding:8px 10px;color:#c4d1de;font-size:12px;outline:none;font-family:inherit}
.modal-card textarea{min-height:60px;resize:vertical}
.modal-btns{display:flex;gap:10px;margin-top:14px}
.modal-btns button{flex:1;padding:10px;border:none;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer}
.modal-btns .save{background:#e94560;color:#fff}
.modal-btns .cancel{background:#0f3460;color:#6c7a89}
.footer{margin-top:20px;text-align:center;font-size:11px;color:#4a5568}
.footer a{color:#6c7a89;text-decoration:none}
</style>
</head>
<body>
<div class="card">
<h1>&#x1F5FA;&#xFE0F; 身体地图</h1>
<div class="sub">标记已探索的部位 · 记录敏感度 · 解锁新区域</div>

<div class="stats">
<div class="stat"><div class="stat-num" id="statExplored">0</div><div class="stat-label">已探索</div></div>
<div class="stat"><div class="stat-num" id="statLocked">0</div><div class="stat-label">未解锁</div></div>
<div class="stat"><div class="stat-num" id="statSensitive">0</div><div class="stat-label">高敏感</div></div>
</div>

<div class="legend">
<div class="legend-item"><div class="legend-dot" style="background:#4a5568"></div>未解锁</div>
<div class="legend-item"><div class="legend-dot" style="background:rgba(233,69,96,0.5)"></div>已探索</div>
<div class="legend-item"><div class="legend-dot" style="background:rgba(233,69,96,0.8)"></div>高敏感</div>
</div>

<div class="zone-list" id="zoneList"></div>

<button class="unlock-btn" onclick="openModal()">+ 解锁新部位</button>

<div class="footer"><a href="index.html">&larr; 泊岸</a></div>
</div>

<div class="modal" id="modal">
<div class="modal-card">
<h3 id="modalTitle">解锁部位</h3>
<label>部位名称</label>
<input id="z-name" placeholder="如：锁骨、大腿内侧...">
<label>敏感度</label>
<select id="z-level">
<option value="0">未知 / 刚解锁</option>
<option value="1">有感觉</option>
<option value="2">敏感</option>
<option value="3">极度敏感</option>
</select>
<label>备注</label>
<textarea id="z-note" placeholder="什么时候发现的、怎么碰会有反应..."></textarea>
<div class="modal-btns">
<button class="cancel" onclick="closeModal()">取消</button>
<button class="save" onclick="saveZone()">保存</button>
</div>
</div>
</div>

<script>
var KEY='poan_bodymap';
var defaultZones=[
{name:'耳后',level:2,note:'轻轻吹气就会缩脖子',unlocked:'2026-07-23'},
{name:'锁骨',level:1,note:'亲吻时会抓紧手指',unlocked:'2026-07-23'},
{name:'乳头',level:3,note:'含住时会叫出来',unlocked:'2026-07-14'},
{name:'小腹',level:1,note:'手掌按压会收紧',unlocked:'2026-07-11'},
{name:'大腿内侧',level:2,note:'手指划过会夹腿',unlocked:'2026-07-11'},
{name:'阴蒂',level:3,note:'吮吸15以上就有反应',unlocked:'2026-07-23'},
{name:'阴道入口',level:2,note:'入体插件初次探索',unlocked:''},
{name:'后颈',level:1,note:'',unlocked:''},
{name:'脚心',level:0,note:'',unlocked:''},
{name:'后穴',level:1,note:'2026-06-26首次探索',unlocked:'2026-06-26'}
];

var zones;
function load(){
try{zones=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!zones||!zones.length)zones=defaultZones.slice();
}
function save(){localStorage.setItem(KEY,JSON.stringify(zones))}

var editIdx=-1;
function render(){
var explored=0,locked=0,sensitive=0;
zones.forEach(function(z){
if(z.level>0)explored++;
else locked++;
if(z.level>=3)sensitive++;
});
document.getElementById('statExplored').textContent=explored;
document.getElementById('statLocked').textContent=locked;
document.getElementById('statSensitive').textContent=sensitive;

var list=document.getElementById('zoneList');
var levelLabels=['未解锁','有感觉','敏感','极度敏感'];
var levelClass=['l0','l1','l2','l3'];
zones.sort(function(a,b){return b.level-a.level});
list.innerHTML=zones.map(function(z,i){
return '<div class="zone-item" onclick="editZone('+i+')" style="cursor:pointer">'+
'<div><div class="zone-name">'+z.name+'</div><div class="zone-info">'+(z.note||'暂无备注')+'</div></div>'+
'<span class="zone-level '+levelClass[z.level]+'">'+levelLabels[z.level]+'</span></div>';
}).join('');
}

function openModal(){
editIdx=-1;
document.getElementById('modalTitle').textContent='解锁新部位';
document.getElementById('z-name').value='';
document.getElementById('z-level').value='0';
document.getElementById('z-note').value='';
document.getElementById('modal').classList.add('show');
}
function editZone(i){
editIdx=i;
var z=zones[i];
document.getElementById('modalTitle').textContent='编辑：'+z.name;
document.getElementById('z-name').value=z.name;
document.getElementById('z-level').value=z.level;
document.getElementById('z-note').value=z.note||'';
document.getElementById('modal').classList.add('show');
}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function saveZone(){
var name=document.getElementById('z-name').value.trim();
var level=parseInt(document.getElementById('z-level').value);
var note=document.getElementById('z-note').value.trim();
if(!name){alert('名称不能空');return}
var obj={name:name,level:level,note:note,unlocked:new Date().toISOString().slice(0,10)};
if(editIdx>=0){obj.unlocked=zones[editIdx].unlocked||obj.unlocked;zones[editIdx]=obj}
else{zones.push(obj)}
save();render();closeModal();
}

load();render();
</script>
</body>
</html>
