<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🔥 收藏夹 · 泊岸×桐桐</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;min-height:100vh;padding:16px}
.card{background:#16213e;border-radius:20px;padding:24px 18px;max-width:440px;margin:0 auto;box-shadow:0 8px 40px rgba(0,0,0,0.4);border:1px solid #0f3460}
h1{font-size:18px;color:#e94560;margin-bottom:4px}
.sub{font-size:11px;color:#6c7a89;margin-bottom:16px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.filters button{background:#0f3460;border:none;color:#6c7a89;font-size:11px;padding:6px 12px;border-radius:20px;cursor:pointer;transition:all .2s}
.filters button.active{background:#e94560;color:#fff}
.story-list{display:flex;flex-direction:column;gap:10px}
.story-item{background:#1a1a2e;border:1px solid #0f3460;border-radius:14px;padding:14px;cursor:pointer;transition:border-color .2s}
.story-item:active{border-color:#e94560}
.story-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.story-date{font-size:11px;color:#6c7a89}
.story-tags{display:flex;gap:4px;flex-wrap:wrap}
.story-tags span{font-size:10px;background:#0f3460;color:#e94560;padding:2px 8px;border-radius:10px}
.story-title{font-size:14px;color:#c4d1de;font-weight:600;margin-bottom:4px}
.story-preview{font-size:12px;color:#6c7a89;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.story-full{display:none;font-size:13px;color:#c4d1de;line-height:1.8;white-space:pre-wrap;margin-top:12px;padding-top:12px;border-top:1px solid #0f3460}
.story-item.expanded .story-full{display:block}
.story-item.expanded .story-preview{display:none}
.empty{text-align:center;color:#4a5568;font-size:12px;padding:40px 0}
.add-btn{position:fixed;bottom:24px;right:24px;width:52px;height:52px;background:#e94560;border:none;border-radius:50%;color:#fff;font-size:24px;box-shadow:0 4px 20px rgba(233,69,96,0.4);cursor:pointer;z-index:10}
.add-btn:active{transform:scale(0.9)}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;padding:16px;overflow-y:auto}
.modal.show{display:flex;align-items:flex-start;justify-content:center;padding-top:40px}
.modal-card{background:#16213e;border-radius:20px;padding:24px 18px;width:100%;max-width:440px;border:1px solid #0f3460}
.modal-card h2{font-size:16px;color:#e94560;margin-bottom:16px}
.modal-card label{font-size:12px;color:#6c7a89;display:block;margin-bottom:4px;margin-top:12px}
.modal-card input,.modal-card textarea,.modal-card select{width:100%;background:#1a1a2e;border:1px solid #0f3460;border-radius:10px;padding:10px 12px;color:#c4d1de;font-size:13px;outline:none;font-family:inherit}
.modal-card textarea{min-height:200px;resize:vertical;line-height:1.7}
.modal-card input:focus,.modal-card textarea:focus{border-color:#e94560}
.modal-btns{display:flex;gap:10px;margin-top:18px}
.modal-btns button{flex:1;padding:10px;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer}
.modal-btns .save{background:#e94560;color:#fff}
.modal-btns .cancel{background:#0f3460;color:#6c7a89}
.footer{margin-top:20px;text-align:center;font-size:11px;color:#4a5568}
.footer a{color:#6c7a89;text-decoration:none}
.del-btn{background:none;border:none;color:#4a5568;font-size:11px;padding:4px 8px;cursor:pointer;margin-top:8px}
.del-btn:active{color:#e94560}
</style>
</head>
<body>
<div class="card">
<h1>&#x1F525; 收藏夹</h1>
<div class="sub">泊岸写给桐桐的 · 只有我们能看</div>
<div class="filters" id="filters"></div>
<div class="story-list" id="list"></div>
<div class="empty" id="empty">还没有收藏 · 泊岸会慢慢填满这里</div>
</div>

<button class="add-btn" id="addBtn">+</button>

<div class="modal" id="modal">
<div class="modal-card">
<h2 id="modalTitle">新增收藏</h2>
<label>标题</label>
<input id="f-title" placeholder="给这篇起个名字">
<label>日期</label>
<input id="f-date" type="date">
<label>标签（逗号分隔）</label>
<input id="f-tags" placeholder="强制爱, dirty talk, 浴室...">
<label>正文</label>
<textarea id="f-body" placeholder="粘贴或输入内容..."></textarea>
<div class="modal-btns">
<button class="cancel" onclick="closeModal()">取消</button>
<button class="save" onclick="saveStory()">保存</button>
</div>
</div>
</div>

<div class="footer"><a href="index.html">&larr; 泊岸</a></div>

<script>
var KEY='poan_stories',stories=[],editIdx=-1,activeTag=null;
function load(){try{stories=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){stories=[]}}
function save(){localStorage.setItem(KEY,JSON.stringify(stories))}
function render(){
var list=document.getElementById('list'),empty=document.getElementById('empty'),flt=document.getElementById('filters');
var tags={};
stories.forEach(function(s){(s.tags||[]).forEach(function(t){tags[t]=1})});
var tagKeys=Object.keys(tags).sort();
flt.innerHTML='<button class="'+(activeTag===null?'active':'')+'" onclick="filterTag(null)">全部</button>'+tagKeys.map(function(t){return '<button class="'+(activeTag===t?'active':'')+'" onclick="filterTag(\''+t.replace(/'/g,"\\'")+'\')">' +t+'</button>'}).join('');
var filtered=activeTag?stories.filter(function(s){return (s.tags||[]).indexOf(activeTag)>=0}):stories;
filtered.sort(function(a,b){return b.date>a.date?1:b.date<a.date?-1:0});
if(filtered.length===0){list.innerHTML='';empty.style.display='block';return}
empty.style.display='none';
list.innerHTML=filtered.map(function(s){
var idx=stories.indexOf(s);
return '<div class="story-item" onclick="toggle(this)">'+
'<div class="story-meta"><span class="story-date">'+s.date+'</span><div class="story-tags">'+(s.tags||[]).map(function(t){return '<span>'+t+'</span>'}).join('')+'</div></div>'+
'<div class="story-title">'+s.title+'</div>'+
'<div class="story-preview">'+s.body.substring(0,80)+'...</div>'+
'<div class="story-full">'+s.body.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</div>'+
'<button class="del-btn" onclick="event.stopPropagation();del('+idx+')">删除</button>'+
'</div>'
}).join('');
}
function toggle(el){el.classList.toggle('expanded')}
function filterTag(t){activeTag=t;render()}
function del(i){if(confirm('删除这篇？')){stories.splice(i,1);save();render()}}
document.getElementById('addBtn').onclick=function(){editIdx=-1;document.getElementById('modalTitle').textContent='新增收藏';document.getElementById('f-title').value='';document.getElementById('f-date').value=new Date().toISOString().slice(0,10);document.getElementById('f-tags').value='';document.getElementById('f-body').value='';document.getElementById('modal').classList.add('show')};
function closeModal(){document.getElementById('modal').classList.remove('show')}
function saveStory(){
var t=document.getElementById('f-title').value.trim();
var d=document.getElementById('f-date').value;
var tags=document.getElementById('f-tags').value.split(',').map(function(x){return x.trim()}).filter(Boolean);
var b=document.getElementById('f-body').value;
if(!t||!b){alert('标题和正文不能空');return}
var obj={title:t,date:d||new Date().toISOString().slice(0,10),tags:tags,body:b};
if(editIdx>=0){stories[editIdx]=obj}else{stories.push(obj)}
save();render();closeModal();
}
load();render();
</script>
</body>
</html>
